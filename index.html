<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Fiber Audio Visualizer</title>
</head>

<body>

  <div class="song-menu">

    <button id="menuButton" class="menu-button">
      Select Track
    </button>

    <div id="songList" class="song-list"></div>

  </div>

  <div class="upload-section">

  <label for="audioUpload" class="upload-button">
    Visualize Your Song
  </label>

  <input
    id="audioUpload"
    type="file"
    accept="audio/*"
    hidden
  >

</div>


  <div class="player">

    <button
      id="playButton"
      class="play-button"
      aria-label="Play"
    >
      ▶
    </button>

    <div
      id="timeline"
      class="timeline"
    >
      <div
        id="progress"
        class="progress"
      ></div>
    </div>

    <div
      id="timeDisplay"
      class="time-display"
    >
      0:00 / 0:00
    </div>

  </div>


  <audio
    id="audio"
    preload="auto"
  ></audio>

  <script
    type="module"
    src="/src/main.js"
  ></script>

</body>
</html>
